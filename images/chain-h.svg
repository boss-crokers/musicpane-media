<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 50 24" width="50" height="24">
  <defs>
    <linearGradient id="metal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4a4a4a" />
      <stop offset="25%" stop-color="#8a8a8a" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="75%" stop-color="#8a8a8a" />
      <stop offset="100%" stop-color="#3a3a3a" />
    </linearGradient>
    <linearGradient id="metal-side" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#333333" />
      <stop offset="50%" stop-color="#bbbbbb" />
      <stop offset="100%" stop-color="#222222" />
    </linearGradient>
    <!-- dx is negative so the shadow still falls downward once the group is rotated -->
    <filter id="shadow" x="-30%" y="-20%" width="160%" height="140%">
      <feDropShadow dx="-2" dy="0" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Same links as chain.svg, laid on their side so the tile repeats horizontally -->
  <g transform="translate(0,24) rotate(-90)">
    <!-- Side connecting pins (behind front links) -->
    <rect x="9" y="-7" width="6" height="14" rx="2" fill="url(#metal-side)" filter="url(#shadow)" />
    <rect x="9" y="18" width="6" height="14" rx="2" fill="url(#metal-side)" filter="url(#shadow)" />
    <rect x="9" y="43" width="6" height="14" rx="2" fill="url(#metal-side)" filter="url(#shadow)" />

    <!-- Closed Top Front Link Loop -->
    <rect x="4" y="2" width="16" height="22" rx="8" fill="none" stroke="url(#metal)" stroke-width="4" filter="url(#shadow)"/>
    <rect x="9.5" y="18" width="5" height="4" fill="url(#metal-side)"/>

    <!-- Closed Bottom Front Link Loop -->
    <rect x="4" y="27" width="16" height="22" rx="8" fill="none" stroke="url(#metal)" stroke-width="4" filter="url(#shadow)"/>
    <rect x="9.5" y="43" width="5" height="4" fill="url(#metal-side)"/>
  </g>
</svg>
